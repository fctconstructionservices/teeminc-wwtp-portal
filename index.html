<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCTC ERP System</title>
  <!-- ===== CSS (Modular) ===== -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- ===== Favicon (optional) ===== -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>" />
</head>
<body>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ===== LOGIN PAGE ===== -->
  <div id="login-container" style="display:flex;height:100vh;align-items:center;justify-content:center;background:var(--bg-primary);">
    <div class="card" style="width:360px;padding:32px;">
      <h2 style="text-align:center;margin-bottom:8px;">🏗️ FCTC ERP</h2>
      <p style="text-align:center;color:var(--text-secondary);margin-bottom:24px;">Construction Management System</p>
      <form id="login-form">
        <div class="form-group">
          <label>Email / Username</label>
          <input type="text" class="form-control" id="login-username" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Login</button>
      </form>
      <p style="text-align:center;font-size:0.75rem;color:var(--text-light);margin-top:16px;">v3.0 · Modular Architecture</p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="app-container" style="display:none;">
    <div class="app-container">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="logo">🏗️ FCTC <span>ERP</span></div>
        <nav>
          <button class="nav-item active" id="nav-home" data-target="home"><span class="icon">🏠</span> Dashboard</button>
          <button class="nav-item" id="nav-projects" data-target="projects"><span class="icon">📋</span> Projects</button>
          <button class="nav-item" id="nav-finance" data-target="finance"><span class="icon">💰</span> Finance</button>
          <button class="nav-item" id="nav-approvals" data-target="approvals"><span class="icon">✅</span> Approvals</button>
          <button class="nav-item" id="nav-materials" data-target="materials"><span class="icon">📦</span> Materials</button>
          <button class="nav-item" id="nav-liquidations" data-target="liquidations"><span class="icon">🧾</span> Liquidations</button>
          <button class="nav-item logout-btn" id="nav-logout" onclick="logoutUser()"><span class="icon">🚪</span> Logout</button>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <!-- TOP HEADER -->
        <header class="top-header">
          <div class="brand">FCTC <span>Construction</span></div>
          <div class="header-actions">
            <span class="user-info">👤 <span id="user-name-display">User</span></span>
            <button class="theme-toggle" id="theme-toggle">🌙</button>
          </div>
        </header>

        <!-- PAGE SECTIONS -->
        <div id="page-home" class="page-section active">Loading dashboard...</div>
        <div id="page-projects" class="page-section">Loading projects...</div>
        <div id="page-finance" class="page-section">Loading finance...</div>
        <div id="page-approvals" class="page-section">Loading approvals...</div>
        <div id="page-materials" class="page-section">Loading materials...</div>
        <div id="page-liquidations" class="page-section">Loading liquidations...</div>
      </main>
    </div>
  </div>

  <!-- ===== JAVASCRIPT (Modular ES Modules) ===== -->
  <script type="module" src="js/app.js"></script>
  
  <!-- ===== UPDATE USER NAME ===== -->
  <script>
    // Quick hack para ma-update ang user name sa header
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('fctc_user') || 'null');
      const nameEl = document.getElementById('user-name-display');
      if (user && nameEl) nameEl.textContent = user.name || 'User';
    });
    // Listen for changes
    window.addEventListener('storage', () => {
      const user = JSON.parse(localStorage.getItem('fctc_user') || 'null');
      const nameEl = document.getElementById('user-name-display');
      if (user && nameEl) nameEl.textContent = user.name || 'User';
    });
  </script>
</body>
</html>
